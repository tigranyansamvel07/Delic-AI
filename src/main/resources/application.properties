spring.application.name=coursework_ahh

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coursework}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:gemma3:4b}

# Last.fm API Configuration
lastfm.api.key=${LASTFM_API_KEY:}
lastfm.api.secret=${LASTFM_API_SECRET:}
lastfm.api.base-url=${LASTFM_API_BASE_URL:https://ws.audioscrobbler.com/2.0/}
